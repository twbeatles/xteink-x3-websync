name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Sanity — no dist artifacts required by tests
        # dist/ 는 gitignore. 클론 직후 없어야 정상 (로컬 전용 데이터 유입 방지 확인)
        run: |
          if [ -d dist ] && [ -n "$(find dist -type f 2>/dev/null | head -1)" ]; then
            echo "::warning::Unexpected files under dist/ in CI checkout"
          fi
          test ! -f dist/synced_posts.json
      - name: Run tests
        # -q: 요약, --tb=short: CI 로그 가독성, -ra: 스킵/실패 사유
        run: python -m pytest tests/ -q --tb=short -ra
